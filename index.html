<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situs Sedang Dalam Pemeliharaan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Latar Belakang Efek Cahaya Animasi -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 2s;"></div>

    <!-- Konten Utama -->
    <div class="relative z-10 max-w-xl w-full mx-4 p-8 sm:p-12 rounded-3xl glass-card shadow-2xl text-center animate-float">
        
        <!-- Ikon Animasi Gear/Tools -->
        <div class="relative w-24 h-24 mx-auto mb-8 flex items-center justify-center">
            <div class="absolute inset-0 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 opacity-20 animate-ping"></div>
            <div class="relative w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-gears text-3xl text-white animate-spin" style="animation-duration: 8s;"></i>
            </div>
        </div>

        <!-- Judul & Deskripsi -->
        <span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-4 uppercase">
            Pembaruan Sistem
        </span>
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-4">Kami Sedang Berbenah</h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8">
            Website kami sedang menjalani pemeliharaan terjadwal untuk menghadirkan pengalaman dan fitur yang jauh lebih luar biasa untuk Anda. Silakan kembali beberapa saat lagi.
        </p>

        <!-- Hitung Mundur Simulasi (Countdown) -->
        <div class="grid grid-cols-3 gap-3 mb-8 max-w-xs mx-auto">
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3">
                <span id="hours" class="block text-2xl font-bold text-indigo-400">02</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">Jam</span>
            </div>
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3">
                <span id="minutes" class="block text-2xl font-bold text-indigo-400">45</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">Menit</span>
            </div>
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3">
                <span id="seconds" class="block text-2xl font-bold text-indigo-400">30</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">Detik</span>
            </div>
        </div>

        <!-- Tombol Aksi / Notifikasi -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <button onclick="checkStatus()" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-medium text-sm transition-all duration-200 shadow-lg shadow-indigo-600/25 active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate text-xs"></i> Cek Status Ulang
            </button>
            <a href="mailto:support@domain.com" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 font-medium text-sm border border-slate-800 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-regular fa-envelope text-xs"></i> Hubungi Kami
            </a>
        </div>

        <!-- Footer Kecil -->
        <p class="text-xs text-slate-600 mt-8">
            &copy; <span id="year"></span> Sistem Terintegrasi. Hak Cipta Dilindungi.
        </p>
    </div>

    <script>
        // Set Tahun Otomatis
        document.getElementById('year').innerText = new Date().getFullYear();

        // Simulasi Timer Hitung Mundur Sederhana
        let totalSeconds = 2 * 3600 + 45 * 60 + 30;
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;

                hoursEl.innerText = String(h).padStart(2, '0');
                minutesEl.innerText = String(m).padStart(2, '0');
                secondsEl.innerText = String(s).padStart(2, '0');
            }
        }, 1000);

        // Fungsi Tombol Cek Status
        function checkStatus() {
            const btn = event.currentTarget;
            const icon = btn.querySelector('i');
            icon.classList.add('fa-spin');
            btn.innerText = ' Memeriksa...';
            btn.prepend(icon);
            
            setTimeout(() => {
                icon.classList.remove('fa-spin');
                alert('Situs masih dalam pemeliharaan. Silakan coba beberapa saat lagi!');
                location.reload();
            }, 1200);
        }
    </script>
</body>
</html>
